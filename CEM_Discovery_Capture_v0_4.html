<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Discovery">
<meta name="theme-color" content="#13233A">
<title>Discovery Capture</title>
<style>
:root{
  --ink:#13233A; --ink2:#24395C; --paper:#E9EDEA; --card:#FFFFFF; --line:#D6DCE0;
  --text:#1B2430; --muted:#5C6975; --signal:#E39B17; --signal-soft:#FDF3E0;
  --risk:#B8392A; --risk-soft:#FBE9E6; --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--paper);color:var(--text);line-height:1.45}
button{font:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--card);display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}

/* Header */
.top{background:var(--ink);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;position:sticky;top:0;z-index:20}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.app-name{font-weight:650;font-size:15px}
.cust{font-size:13px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:12px}
.seg{height:7px;border:none;border-radius:4px;background:rgba(255,255,255,.18);cursor:pointer;padding:0}
.seg.done{background:rgba(227,155,23,.5)}
.seg.current{background:var(--signal)}
.step-meta{font-size:12px;opacity:.85;margin-top:8px}
.banner{background:var(--signal-soft);color:#6B4700;font-size:13px;padding:10px 18px;border-bottom:1px solid #F2DDB0}

/* Content */
main{flex:1;padding:24px 18px 130px}
.title{font-size:25px;line-height:1.2;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
.intro{color:var(--muted);font-size:15px;margin-bottom:24px;max-width:60ch}
.h2{font-size:17px;font-weight:650;margin:30px 0 12px}
.field{margin-bottom:24px}
.label{display:block;font-weight:600;font-size:15px;margin-bottom:8px}
.sub{font-weight:400;color:var(--muted);font-size:13px}
input[type=text],input[type=number],textarea{width:100%;font:inherit;font-size:16px;padding:12px 13px;border:1.5px solid var(--line);border-radius:var(--r);background:#fff;color:var(--text)}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--ink2);box-shadow:0 0 0 3px rgba(36,57,92,.18)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:11px;width:100%;text-align:left;font-size:15px;padding:13px 14px;border:1.5px solid var(--line);border-radius:var(--r);background:#fff;color:var(--text);cursor:pointer}
.opt::before{content:"";width:18px;height:18px;border-radius:50%;border:2px solid #9AA6B1;flex:none;box-sizing:border-box}
.opt.on{border-color:var(--ink);background:#F2F5F9;font-weight:600}
.opt.on::before{border:6px solid var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:14px;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--text);cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
.num span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.num input{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;text-align:center}
.photos{background:#F5F7F6;border:1.5px dashed #C3CBD1;border-radius:var(--r);padding:14px}
.photo-add{position:relative;display:block;text-align:center}
.vh{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.thumb{position:relative}
.thumb img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#E3E7EA;display:block}
.x{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;border:none;background:var(--risk);color:#fff;font-size:15px;line-height:24px;cursor:pointer}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px}
.center{text-align:center}

/* Buttons */
.btn{font-weight:650;font-size:15px;padding:14px;border-radius:var(--r);border:1.5px solid var(--ink);cursor:pointer;background:#fff;color:var(--ink)}
.btn.primary{background:var(--ink);color:#fff}
.btn.signal{background:var(--signal);border-color:var(--signal);color:#241700}
.btn.wide{display:block;width:100%;margin-top:10px}
.btn.sm{padding:8px 12px;font-size:13px}
.btn.text{border-color:transparent;background:none;color:var(--risk)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.link{background:none;border:none;color:var(--ink2);font-weight:600;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;gap:10px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);z-index:15}
.nav .btn:first-child{flex:.4}
.nav .btn:last-child{flex:1}

/* Home */
.saved{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--line)}
.saved strong{display:block;font-size:15px}
.saved span{font-size:13px;color:var(--muted)}
.saved-btns{display:flex;gap:4px;flex:none}
.empty{color:var(--muted);font-size:14px;padding:12px 0}
.foot{font-size:12px;color:var(--muted);margin-top:34px}

/* Review */
.snap{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--line);border-radius:var(--r);margin-bottom:18px}
.snap div{padding:12px 10px;text-align:center}
.snap div+div{border-left:1.5px solid var(--line)}
.snap b{display:block;font-size:24px;font-variant-numeric:tabular-nums;color:var(--ink)}
.snap span{font-size:12.5px;color:var(--muted)}
.board{border-radius:var(--r);overflow:hidden;border:1.5px solid var(--ink);margin-bottom:16px}
.board-head{background:var(--ink);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.board-head h2{font-size:16px;font-weight:650}
.board-head span{font-size:12.5px;opacity:.85}
.flag{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:12px 14px;border-top:1px solid var(--line);font-size:14.5px}
.flag:first-of-type{border-top:none}
.tag{font-size:12px;font-weight:700;padding:3px 0;border-radius:5px;text-align:center;height:fit-content}
.tag.risk{background:var(--risk-soft);color:var(--risk)}
.tag.check{background:var(--signal-soft);color:#7A5000}
.tag.note{background:#EDF0F3;color:var(--muted)}
.board-foot{font-size:12.5px;color:var(--muted);padding:10px 14px;background:#F5F7F6;border-top:1px solid var(--line)}
.ans-step{border-top:1px solid var(--line);padding:14px 0}
.ans-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.ans-head h3{font-size:15px;font-weight:650}
.ans-row{display:grid;grid-template-columns:44% 1fr;gap:10px;font-size:13.5px;padding:3px 0}
.ans-row dt{color:var(--muted)}
.ans-row dd{font-weight:600}

/* Toast and sheet */
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:14px;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:40}
.toast.show{opacity:1}
.sheet{position:fixed;inset:0;background:rgba(19,35,58,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet[hidden]{display:none}
.sheet-card{background:#fff;width:100%;max-width:520px;border-radius:14px 14px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet-card textarea{min-height:260px;font-size:13px;margin:10px 0}
/* Voice debrief */
.rec-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-bottom:10px}
.rec-btn .dot{width:12px;height:12px;border-radius:50%;background:var(--risk);flex:none}
.rec-btn.on{background:var(--risk);border-color:var(--risk);color:#fff}
.rec-btn.on .dot{background:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
#debriefText{min-height:180px}
.stepno{display:flex;gap:10px;align-items:baseline;font-size:17px;font-weight:650;margin:28px 0 10px}
.doc{border:1.5px solid var(--line);border-radius:var(--r);background:#FBFCFB;padding:16px;margin-top:12px;max-height:300px;overflow:auto}
.doc h4{font-size:14px;margin:14px 0 4px}
.doc h4:first-child{margin-top:0}
.doc p,.doc li{font-size:13.5px;color:var(--text)}
.doc ul{margin:2px 0 0 18px}
.doc .dim{color:var(--muted)}
.stepno b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;flex:none}
.from{display:inline-block;margin-left:6px;font-size:12px;font-weight:600;background:var(--signal-soft);color:#7A5000;border:1px solid #F2DDB0;border-radius:6px;padding:2px 8px;cursor:pointer;vertical-align:1px}
.from-dd{font-size:11.5px;font-weight:600;color:#7A5000;margin-left:4px}
.sug{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.sug input{width:20px;height:20px;margin-top:2px;accent-color:var(--ink)}
.sug strong{display:block;font-size:13px;color:var(--muted);font-weight:600}
.sug-val{display:block;font-weight:650;font-size:15px;color:var(--ink)}
.sug-cur{display:block;font-size:12.5px;color:var(--risk);margin-top:2px}
.sug q{display:block;font-size:13px;color:var(--muted);font-style:italic;margin-top:4px}
.missing{margin:6px 0 0 18px;font-size:14px}
.missing li{margin-bottom:4px}
.mic{width:18px;height:18px;flex:none}
.btn.icon{display:flex;align-items:center;justify-content:center;gap:8px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}.rec-btn.on .dot{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="app-name">Discovery Capture</span><span class="cust" id="custName"></span></div>
    <div class="steps" id="steps" hidden></div>
    <div class="step-meta" id="stepMeta" hidden></div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <main id="view"></main>
  <nav class="nav" id="nav" hidden>
    <button class="btn" id="backBtn" type="button"></button>
    <button class="btn primary" id="nextBtn" type="button"></button>
  </nav>
</div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <strong id="sheetTitle">Copy this text</strong>
    <p class="hint">Copying is blocked here. Select the text below and copy it manually.</p>
    <textarea id="sheetText" readonly></textarea>
    <button class="btn primary wide" type="button" onclick="closeSheet()">Close</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// ============================================================================
// Discovery Capture: critical event management site discovery (prototype)
// Questions live in the STEPS config below. Edit it to change the survey.
// ============================================================================
const APP_VERSION = '0.4 prototype';

const STEPS = [
  { title:'Organization', intro:'Who the customer is and where they operate.', fields:[
    {id:'customerName', label:'Customer name', type:'text', placeholder:'e.g. Brazos Valley Health System'},
    {id:'projectName', label:'Project name', type:'text'},
    {id:'industry', label:'Industry', type:'radio', options:['Healthcare','Utilities','Local government','Higher education','Transportation','Corporate / enterprise']},
    {id:'hq', label:'Headquarters (state or country)', type:'text'},
    {id:'footprint', label:'Footprint', type:'numbers', items:[{id:'sites',label:'Sites or facilities'},{id:'regions',label:'Regions'}]},
    {id:'photosSite', label:'Command center or EOC photos', sub:'Room layout, displays, whiteboards', type:'photos'}
  ]},
  { title:'Use cases', intro:'What they want to solve and why now.', fields:[
    {id:'modules', label:'Capabilities needed', sub:'Select all that apply', type:'chips', options:['Incident management','Emergency management','Crisis management','Business continuity','Security operations','Health and safety','Risk management']},
    {id:'driver', label:'Main reason for buying now', type:'radio', options:['Recent incident exposed gaps','Audit or regulatory finding','Replacing email and spreadsheets','Replacing a legacy system','New mandate or leadership priority']},
    {id:'driverNotes', label:'In their words', type:'textarea', placeholder:'What happened, and who is pushing for this', showIf:d=>!!d.driver},
    {id:'currentTools', label:'Tools used today', type:'text', placeholder:'e.g. email, spreadsheets, paper binders'},
    {id:'goLive', label:'Target go-live', type:'text', placeholder:'e.g. before hurricane season 2027'}
  ]},
  { title:'Users and roles', intro:'Who will use the platform and how.', fields:[
    {id:'users', label:'Named users by role', type:'numbers', items:[{id:'responders',label:'Responders'},{id:'commanders',label:'Incident commanders'},{id:'executives',label:'Executives'},{id:'admins',label:'Platform admins'}]},
    {id:'allStaff', label:'Can any employee report an incident?', type:'radio', options:['Yes','No']},
    {id:'commandModel', label:'Command structure', type:'radio', options:['ICS / NIMS','HICS (hospital)','Corporate crisis team','Not formally defined']},
    {id:'mobile', label:'Field reporting from phones?', type:'radio', options:['Yes','No']},
    {id:'offline', label:'Needs to work without signal?', type:'radio', options:['Yes','No','Unsure'], showIf:d=>d.mobile==='Yes'}
  ]},
  { title:'Plans and workflows', intro:'How incidents are handled today.', fields:[
    {id:'incidentTypes', label:'Most common incident types', type:'textarea', placeholder:'e.g. severe weather, IT outage, active threat'},
    {id:'severity', label:'Severity levels defined', type:'radio', options:['3 levels','4 levels','5 levels','Not defined']},
    {id:'plans', label:'Existing plans', sub:'Select all that apply', type:'chips', exclusive:'None documented', options:['Business continuity plans','Emergency operations plan','Checklists','Playbooks','None documented']},
    {id:'planFormat', label:'Where plans live today', type:'radio', options:['Word or PDF','Spreadsheets','Legacy system','Paper binders'], showIf:d=>(d.plans||[]).length>0 && !(d.plans||[]).includes('None documented')},
    {id:'escalation', label:'Escalation paths documented?', type:'radio', options:['Yes','Partially','No']},
    {id:'afterAction', label:'After-action reviews', type:'radio', options:['Formal and consistent','Informal','Not done']},
    {id:'photosPlans', label:'Plan and binder photos', sub:'Current plans, checklists, call trees', type:'photos'}
  ]},
  { title:'Integrations', intro:'Systems the platform needs to connect to.', fields:[
    {id:'sso', label:'Identity provider for single sign-on', type:'radio', options:['Microsoft Entra ID','Okta','Ping','Other','Unknown']},
    {id:'hrSync', label:'Sync the staff directory from HR?', type:'radio', options:['Yes','No','Unsure']},
    {id:'massNotify', label:'Mass notification today', type:'text', placeholder:'Vendor and contract timing'},
    {id:'collab', label:'Collaboration tools', sub:'Select all that apply', type:'chips', options:['Microsoft Teams','Slack','Email','SMS']},
    {id:'gis', label:'GIS or mapping', type:'radio', options:['Esri ArcGIS','Other','None']},
    {id:'otherSystems', label:'Other systems to connect', type:'textarea', placeholder:'e.g. ServiceNow, access control, video, EHR'}
  ]},
  { title:'Security and rollout', intro:'Hosting, compliance, and who owns it after go-live.', fields:[
    {id:'residency', label:'Where data must be hosted', type:'radio', options:['United States','Canada','European Union','United Kingdom','Australia','Multiple regions']},
    {id:'frameworks', label:'Standards and regulations in scope', sub:'Select all that apply', type:'chips', options:['NIMS / ICS','HICS','Joint Commission','CMS Emergency Preparedness','HIPAA','ISO 22301','NERC CIP','OSHA']},
    {id:'securityReview', label:'Formal security review required?', type:'radio', options:['Yes','No','Unsure']},
    {id:'adminOwner', label:'Who owns the platform after go-live?', type:'text', placeholder:'Role and team size'},
    {id:'training', label:'Training needed for', sub:'Select all that apply', type:'chips', options:['Admins','Incident commanders','Responders','Executives','All staff']},
    {id:'rolloutNotes', label:'Rollout notes', type:'textarea', placeholder:'Phasing, procurement steps, budget timing'}
  ]}
];

// Fictional customer for demos. No real customer data.
const SAMPLE = {
  customerName:'Brazos Valley Health System', projectName:'Enterprise incident and continuity platform',
  industry:'Healthcare', hq:'Texas', sites:'14', regions:'2',
  modules:['Incident management','Emergency management','Business continuity'],
  driver:'Audit or regulatory finding',
  driverNotes:'Last accreditation survey flagged inconsistent emergency drills and after-action documentation. The COO is sponsoring a fix before the next survey.',
  currentTools:'Email, spreadsheets, paper HICS binders, shared drive',
  goLive:'Before hurricane season 2027',
  responders:'220', commanders:'35', executives:'12', admins:'2',
  allStaff:'Yes', commandModel:'HICS (hospital)', mobile:'Yes', offline:'Yes',
  incidentTypes:'Severe weather, IT and EHR downtime, utility failure, mass casualty surge, infant abduction (Code Pink), active threat',
  severity:'4 levels', plans:['Business continuity plans','Emergency operations plan','Checklists'], planFormat:'Paper binders',
  escalation:'Partially', afterAction:'Informal',
  sso:'Microsoft Entra ID', hrSync:'Yes', massNotify:'Existing vendor, contract ends mid-2027',
  collab:['Microsoft Teams','Email','SMS'], gis:'Esri ArcGIS',
  otherSystems:'EHR (read-only bed census during surge events), badge access control',
  residency:'United States', frameworks:['HICS','Joint Commission','CMS Emergency Preparedness','HIPAA'],
  securityReview:'Yes', adminOwner:'Emergency management coordinator (1 person)',
  training:['Admins','Incident commanders','Responders'],
  rolloutNotes:'Wants the flagship hospital live first, then the 13 clinics. Budget approval cycle closes in Q1.'
};

const SAMPLE_DEBRIEF = "Just left Lone Star Water and Power. They're a utility with 22 sites across three regions. The VP of Operations is sponsoring this, and it came out of the February ice storm, where outage coordination ran over email and a spreadsheet and nobody had one picture of what was going on. They run a corporate crisis team, but field crews use ICS. Around 400 field staff would report from phones, and a lot of their territory has no signal. They use Entra ID for sign-in, and Esri for mapping. They already have a mass notification vendor. Plans are mostly Word documents on a shared drive. They want to be live before next winter. Security review is required, and IT wants the questionnaire early.";

const PHOTO_FIELDS = ['photosSite','photosPlans'];
const FIELD_INDEX = {};
const NUM_ITEMS = {};
STEPS.forEach(s => s.fields.forEach(f => { FIELD_INDEX[f.id] = f; if (f.type === 'numbers') f.items.forEach(it => { NUM_ITEMS[it.id] = it; }); }));

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseInt(v, 10); return isNaN(n) ? 0 : n; };
const clone = o => JSON.parse(JSON.stringify(o));
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

let data = {}, currentId = null, screen = 'home', saveTimer = null, toastTimer = null, pending = null;

function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400); }
function banner(msg){ const b = $('banner'); b.textContent = msg; b.hidden = false; }

// ---------------------------------------------------------------------------
// Storage: answers in localStorage, photos in IndexedDB (much larger limit).
// Both fall back to memory if the browser blocks them.
// ---------------------------------------------------------------------------
const KEY = 'cemDiscovery.v1';
const mem = {};
const lsOK = (() => { try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; } catch(e){ return false; } })();
if (!lsOK) setTimeout(() => banner("Saving to this device isn't available here. Progress stays until you close the page."), 0);

function sget(k){ if (lsOK) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){} } return mem[k] || null; }
function sset(k, v){
  mem[k] = v;
  if (!lsOK) return false;
  try { localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch(e){ banner('Device storage is full. Delete old captures from the home screen to keep saving.'); return false; }
}

// AI assistant: prompts are model-agnostic, so this only changes labels and links.
const ASSISTANTS = {
  gemini: { name:'Gemini', url:'https://gemini.google.com/app' },
  claude: { name:'Claude', url:'https://claude.ai/new' },
  chatgpt: { name:'ChatGPT', url:'https://chatgpt.com/' }
};
const AKEY = 'cemDiscovery.assistant';
let assistantId = 'gemini';
try { if (lsOK && ASSISTANTS[localStorage.getItem(AKEY)]) assistantId = localStorage.getItem(AKEY); } catch(e){}
const AI = () => ASSISTANTS[assistantId];
function setAssistant(id){ assistantId = id; try { if (lsOK) localStorage.setItem(AKEY, id); } catch(e){} render(); }
const openLink = () => `<a class="link" href="${AI().url}" target="_blank" rel="noopener">Open ${AI().name}</a>`;

const photoCache = {};
let dbPromise = null;
function db(){
  if (dbPromise) return dbPromise;
  dbPromise = new Promise(res => {
    try {
      const r = indexedDB.open('cem-discovery', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('photos');
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
    } catch(e){ res(null); }
  });
  return dbPromise;
}
async function putPhoto(id, url){
  photoCache[id] = url;
  const d = await db(); if (!d) return;
  await new Promise(r => { try { const tx = d.transaction('photos','readwrite'); tx.objectStore('photos').put(url, id); tx.oncomplete = r; tx.onerror = r; } catch(e){ r(); } });
}
async function getPhoto(id){
  if (photoCache[id]) return photoCache[id];
  const d = await db(); if (!d) return null;
  return new Promise(r => { try { const q = d.transaction('photos').objectStore('photos').get(id); q.onsuccess = () => { if (q.result) photoCache[id] = q.result; r(q.result || null); }; q.onerror = () => r(null); } catch(e){ r(null); } });
}
async function delPhoto(id){
  delete photoCache[id];
  const d = await db(); if (!d) return;

function compress(dataUrl, cb){
  const img = new Image();
  img.onload = () => {
    const max = 1000; let w = img.width, h = img.height;
    if (w > h && w > max) { h *= max / w; w = max; } else if (h >= w && h > max) { w *= max / h; h = max; }
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    cb(c.toDataURL('image/jpeg', 0.72));
  };
  img.onerror = () => cb(null);
  img.src = dataUrl;
}

  const done = () => { if (--pending === 0) { scheduleSave(); render(); if (failed) toast(`${plural(failed,'photo')} couldn't be read`); } };
  files.forEach(file => {

      if (!url) { failed++; done(); return; }
      const id = `${currentId}:${fid}:${Date.now()}${Math.random().toString(36).slice(2,6)}`;
      await putPhoto(id, url);

  });
}

  const a = answersBySection(d), fl = flags(d), mods = d.modules || [];
  const sentence = [];
  if (d.industry) sentence.push(`${d.customerName || 'The customer'} is in ${d.industry.toLowerCase()}`);
  if (num(d.sites)) sentence.push(`operating ${plural(num(d.sites),'site')}${num(d.regions) ? ` across ${plural(num(d.regions),'region')}` : ''}`);
  const line1 = sentence.length ? sentence.join(', ') + '.' : 'Customer profile not yet captured.';
  const line2 = d.driver ? `Driver for this project: ${d.driver.toLowerCase()}.` : 'No buying driver captured.';
  const line3 = mods.length ? `Capabilities in scope: ${mods.join(', ')}.` : 'No capabilities selected yet.';
  const line4 = d.goLive ? `Target go-live: ${d.goLive}.` : 'No target go-live captured.';
  const pricingInputs = [
    ['Sites', num(d.sites) || 'Not captured'],
    ['Named users', totalUsers(d) || 'Not captured'],
    ['Capabilities', mods.length ? mods.join(', ') : 'Not captured'],
    ['Integrations', [d.sso && `SSO: ${d.sso}`, d.hrSync === 'Yes' && 'HR directory sync', d.gis && d.gis !== 'None' && `GIS: ${d.gis}`, d.massNotify && 'Mass notification', d.otherSystems].filter(Boolean).join('; ') || 'Not captured'],
    ['Hosting region', d.residency || 'Not captured'],
    ['Training audiences', (d.training || []).join(', ') || 'Not captured']
  ];
  const open = [];
  if (!d.adminOwner) open.push('Who owns the platform after go-live?');
  if (!d.goLive) open.push('What date or event is driving the timeline?');
  if (!d.sso || d.sso === 'Unknown') open.push('Which identity provider is used for single sign-on?');
  if (!totalUsers(d)) open.push('How many users by role?');
  if (!num(d.sites)) open.push('How many sites and regions are in scope?');
  if (d.escalation && d.escalation !== 'Yes') open.push('Who can complete the escalation paths, and by when?');
  if (!(d.plans || []).length) open.push('What plans and checklists exist today?');
  return { line1, line2, line3, line4, flags: fl, answers: a, pricingInputs, open };
}
function draftText(d){
  const s = draftSections(d), L = [];
  L.push(`${d.customerName || 'Unnamed customer'}: Discovery Summary`);
  L.push(`${d.projectName || 'Discovery'} | Prepared ${new Date().toLocaleDateString()} | Internal working document, stage 1 toward proposal`);
  L.push('', 'SITUATION', s.line1, s.line2, s.line3, s.line4);
  L.push('', 'READINESS FLAGS');
  s.flags.length ? s.flags.forEach(f => L.push(`- ${LEVEL_LABEL[f.level]}: ${f.text}`)) : L.push('- None raised by the capture rules.');
  L.push('', 'WHAT WAS CAPTURED');
  Object.entries(s.answers).forEach(([sec, rows]) => {
    L.push(sec);
    Object.entries(rows).forEach(([k, v]) => L.push(`- ${k}: ${Array.isArray(v) ? v.join(', ') : v}`));
  });
  L.push('', 'PRICING INPUTS');
  L.push('Budgetary estimate to be provided from the approved pricing tool.');
  s.pricingInputs.forEach(r => L.push(`- ${r[0]}: ${r[1]}`));
  if (s.open.length) { L.push('', 'OPEN QUESTIONS'); s.open.forEach(q => L.push(`- ${q}`)); }
  if (d.debrief) L.push('', 'ENGINEER DEBRIEF', d.debrief);
  L.push('', `Built on device by Discovery Capture ${APP_VERSION}. No pricing is generated by AI.`);
  return L.join('\n');
}
function copyDraft(){ saveNow(); copyText(draftText(data), 'Draft summary copied'); }
function emailDraft(){
  saveNow();
  let body = draftText(data);
  if (body.length > 1800) body = body.slice(0, 1780) + '\n(truncated, use Copy draft for the full text)';
  location.href = 'mailto:?subject=' + encodeURIComponent(`Discovery summary: ${data.customerName || 'customer'}`) + '&body=' + encodeURIComponent(body);
}

function renderDeliverables(){
  const d = data, s = draftSections(d);
  return `
    <h1 class="title">Create deliverables</h1>
    <p class="intro">Stage one toward a proposal. The draft below is built on this device from your answers. ${AI().name} turns it into a full internal summary plus a customer recap.</p>

    <div class="stepno"><b>1</b>Send the capture to ${AI().name}</div>
    <button type="button" class="btn signal wide" onclick="copyPrompt()">Copy capture for ${AI().name}</button>
    <p class="hint center">Paste it into your Discovery Document Builder Gem. ${openLink()}</p>
    <p class="hint">You get two parts: an internal summary with risks and gaps, then a customer recap with the internal judgments removed. Export each separately before sending anything out.</p>

    <div class="stepno"><b>2</b>Or use the on-device draft</div>
    <p class="hint">No AI involved. Useful with no signal, or when customer data can't leave the device.</p>
    <div class="doc">
      <h4>${esc(d.customerName || 'Unnamed customer')}: Discovery Summary</h4>
      <p class="dim">${esc(d.projectName || 'Discovery')} | Internal working document, stage 1 toward proposal</p>
      <h4>Situation</h4><p>${esc(s.line1)} ${esc(s.line2)} ${esc(s.line3)} ${esc(s.line4)}</p>
      <h4>Readiness flags</h4>
      ${s.flags.length ? `<ul>${s.flags.map(f => `<li><strong>${LEVEL_LABEL[f.level]}:</strong> ${esc(f.text)}</li>`).join('')}</ul>` : '<p class="dim">None raised.</p>'}
      <h4>Pricing inputs</h4>
      <p class="dim">Budgetary estimate to be provided from the approved pricing tool.</p>
      <ul>${s.pricingInputs.map(r => `<li>${esc(r[0])}: ${esc(r[1])}</li>`).join('')}</ul>
      ${s.open.length ? `<h4>Open questions</h4><ul>${s.open.map(q => `<li>${esc(q)}</li>`).join('')}</ul>` : ''}
    </div>
    <div class="row2">
      <button type="button" class="btn" onclick="copyDraft()">Copy draft</button>
      <button type="button" class="btn" onclick="emailDraft()">Email draft</button>
    </div>
    <p class="hint">Pricing is never written by AI. These are the inputs an approved pricing tool would use.</p>`;
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function renderField(f){
  if (f.showIf && !f.showIf(data)) return '';
  const v = data[f.id], lid = `l_${f.id}`;
  const src = data._src || {};
  const fromDebrief = f.type === 'numbers' ? f.items.some(it => src[it.id]) : !!src[f.id];
  const tag = fromDebrief ? `<button type="button" class="from" data-src="${f.id}" onclick="confirmSrc('${f.id}')" aria-label="From voice debrief. Tap to confirm this answer">From debrief, tap to confirm</button>` : '';
  const lab = `<span class="label" id="${lid}">${esc(f.label)}${f.sub ? ` <span class="sub">${esc(f.sub)}</span>` : ''}${tag}</span>`;
  let body = '';
  switch (f.type) {
    case 'text':
      body = `<input type="text" id="f_${f.id}" aria-labelledby="${lid}" value="${esc(v)}" placeholder="${esc(f.placeholder || '')}" autocomplete="off" oninput="setVal('${f.id}', this.value)">`; break;
    case 'textarea':
      body = `<textarea id="f_${f.id}" aria-labelledby="${lid}" placeholder="${esc(f.placeholder || '')}" oninput="setVal('${f.id}', this.value)">${esc(v)}</textarea>`; break;
    case 'radio':
      body = `<div class="opts" role="radiogroup" aria-labelledby="${lid}">${f.options.map((o, j) =>
        `<button type="button" role="radio" aria-checked="${v === o}" class="opt${v === o ? ' on' : ''}" onclick="pick('${f.id}', ${j})">${esc(o)}</button>`).join('')}</div>`; break;
    case 'chips': {
      const arr = v || [];
      body = `<div class="chips" role="group" aria-labelledby="${lid}">${f.options.map((o, j) =>
        `<button type="button" aria-pressed="${arr.includes(o)}" class="chip${arr.includes(o) ? ' on' : ''}" onclick="toggle('${f.id}', ${j})">${esc(o)}</button>`).join('')}</div>`; break;
    }
    case 'numbers':
      body = `<div class="nums">${f.items.map(it =>
        `<label class="num"><span>${esc(it.label)}</span><input type="number" inputmode="numeric" min="0" value="${esc(data[it.id])}" oninput="setVal('${it.id}', this.value)"></label>`).join('')}</div>`; break;
    case 'photos': {
      const ps = v || [];
      body = `<div class="photos">
        <label class="btn photo-add">Add photos<input class="vh" type="file" accept="image/*" multiple onchange="addPhotos('${f.id}', this)" aria-labelledby="${lid}"></label>
        ${ps.length ? `<div class="thumbs">${ps.map((p, j) => `<div class="thumb"><img data-pid="${esc(p.id)}" alt="${esc(p.name)}"><button type="button" class="x" aria-label="Remove ${esc(p.name)}" onclick="removePhoto('${f.id}', ${j})">×</button></div>`).join('')}</div>` : ''}
        <p class="hint">${ps.length ? plural(ps.length,'photo') + ' saved on this device.' : 'Take new photos or choose from your library.'}</p>
      </div>`; break;
    }
  }
  return `<div class="field">${lab}${body}</div>`;
}

function renderHome(){
  const caps = getCaps().slice().reverse();
  return `
    <h1 class="title">Site discovery</h1>
    <p class="intro">Capture a customer's requirements on site in about 15 minutes. At the end, readiness flags highlight gaps, and one tap prepares an AI review for ${AI().name}. Just out of a meeting? Start with a voice debrief.</p>
    <button class="btn primary wide" type="button" onclick="startNew(false)">Start new capture</button>
    <button class="btn wide icon" type="button" onclick="startNew(false, 'debrief')"><svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Start from a voice debrief</button>
    <button class="btn wide" type="button" onclick="startNew(true)">Load sample customer</button>
    <h2 class="h2">Saved captures</h2>
    ${caps.length ? caps.map(c => `
      <div class="saved">
        <div><strong>${esc(c.data.customerName || 'Unnamed customer')}</strong>
        <span>${new Date(c.ts).toLocaleDateString()}, ${c.screen === 'review' ? 'ready for review' : c.screen === 'debrief' ? 'voice debrief' : c.screen === 'deliver' ? 'ready for deliverables' : `step ${c.screen + 1} of ${STEPS.length}`}</span></div>
        <div class="saved-btns">
          <button class="btn sm" type="button" onclick="resume('${c.id}')">Open</button>
          <button class="btn sm text" type="button" onclick="del('${c.id}')" aria-label="Delete ${esc(c.data.customerName || 'capture')}">Delete</button>
        </div>
      </div>`).join('') : `<p class="empty">No captures yet. Captures save automatically as you go.</p>`}
    <h2 class="h2">AI assistant</h2>
    <div class="chips" role="radiogroup" aria-label="AI assistant">${Object.entries(ASSISTANTS).map(([id, a]) =>
      `<button type="button" role="radio" aria-checked="${id === assistantId}" class="chip${id === assistantId ? ' on' : ''}" onclick="setAssistant('${id}')">${a.name}</button>`).join('')}</div>
    <p class="hint">The prompts work the same in any of these. Use the one your company has approved.</p>
    <p class="foot">Discovery Capture ${APP_VERSION}. Data stays on this device until you copy or email it.</p>`;
}

function renderStep(i){
  const s = STEPS[i];
  return `<h1 class="title">${esc(s.title)}</h1><p class="intro">${esc(s.intro)}</p>${s.fields.map(renderField).join('')}`;
}

function renderReview(){
  const d = data, fl = flags(d);
  const c = { risk:0, check:0, note:0 }; fl.forEach(f => c[f.level]++);
  const summary = [c.risk && plural(c.risk,'risk'), c.check && plural(c.check,'check'), c.note && plural(c.note,'note')].filter(Boolean).join(', ') || 'None';
  const photoCount = PHOTO_FIELDS.reduce((n, f) => n + (d[f] || []).length, 0);
  return `
    <h1 class="title">${esc(d.customerName || 'Unnamed customer')}</h1>
    <p class="intro">${esc(d.projectName || 'Discovery review')}</p>
    <div class="snap">
      <div><b>${num(d.sites)}</b><span>Sites</span></div>
      <div><b>${totalUsers(d)}</b><span>Named users</span></div>
      <div><b>${(d.modules || []).length}</b><span>Capabilities</span></div>
    </div>
    <section class="board" aria-labelledby="bh">
      <div class="board-head"><h2 id="bh">Readiness flags</h2><span>${summary}</span></div>
      ${fl.length ? fl.map(f => `<div class="flag"><span class="tag ${f.level}">${LEVEL_LABEL[f.level]}</span><p>${esc(f.text)}</p></div>`).join('')
                  : `<p class="flag" style="display:block">No flags raised. Run the AI review for a deeper check.</p>`}
      <p class="board-foot">These are rule-based checks. The AI review goes deeper.</p>
    </section>
    <button class="btn wide icon" type="button" onclick="go('debrief')"><svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>${d.debrief ? 'Edit voice debrief' : 'Add a voice debrief'}</button>
    <button class="btn signal wide" type="button" onclick="go('deliver')">Create deliverables</button>
    <p class="hint center">Draft summary, pricing inputs, and the hand-off to ${AI().name}.</p>
    <div class="row2">
      <button class="btn" type="button" onclick="copyData()">Copy data</button>
      <button class="btn" type="button" onclick="emailSummary()">Email summary</button>
    </div>
    ${photoCount ? `<button class="btn wide" type="button" onclick="downloadPhotos()">Download ${plural(photoCount,'photo')}</button>` : ''}
    <h2 class="h2">All answers</h2>
    ${STEPS.map((s, i) => {
      const src = d._src || {};
      const rows = s.fields.filter(f => !(f.showIf && !f.showIf(d))).map(f => [f.label, displayValue(f, d), f.type === 'numbers' ? f.items.some(it => src[it.id]) : !!src[f.id]]).filter(r => r[1]);
      return `<div class="ans-step">
        <div class="ans-head"><h3>${esc(s.title)}</h3><button class="link" type="button" onclick="go(${i})">Edit</button></div>
        ${rows.length ? `<dl>${rows.map(r => `<div class="ans-row"><dt>${esc(r[0])}</dt><dd>${esc(r[1])}${r[2] ? '<span class="from-dd">(debrief)</span>' : ''}</dd></div>`).join('')}</dl>` : `<p class="empty">Nothing captured yet.</p>`}
      </div>`;
    }).join('')}
    <button class="btn text wide" type="button" onclick="discard()">Delete this capture</button>`;
}

function updateChrome(){
  const isStep = typeof screen === 'number', isReview = screen === 'review', isDebrief = screen === 'debrief', isDeliver = screen === 'deliver';
  $('custName').textContent = screen === 'home' ? '' : (data.customerName || '');
  const steps = $('steps'), meta = $('stepMeta');
  steps.hidden = !(isStep || isReview);
  meta.hidden = !(isStep || isReview || isDebrief || isDeliver);
  if (isDebrief) meta.textContent = 'Voice debrief';
  if (isDeliver) meta.textContent = 'Create deliverables';
  if (isStep || isReview) {
    steps.innerHTML = STEPS.map((s, i) => {
      const cls = isReview || i < screen ? 'done' : (i === screen ? 'current' : '');
      return `<button type="button" class="seg ${cls}" aria-label="Go to step ${i + 1}: ${esc(s.title)}"${i === screen ? ' aria-current="step"' : ''} onclick="go(${i})"></button>`;
    }).join('');
    meta.textContent = isReview ? 'Review' : `Step ${screen + 1} of ${STEPS.length}: ${STEPS[screen].title}`;
  }
  const nav = $('nav'), back = $('backBtn'), next = $('nextBtn');
  nav.hidden = screen === 'home';
  next.hidden = false;
  if (isStep) {
    back.textContent = screen === 0 ? 'Menu' : 'Back';
    next.textContent = screen === STEPS.length - 1 ? 'Review' : 'Next';
    back.onclick = () => screen === 0 ? (saveNow(), go('home')) : go(screen - 1);
    next.onclick = () => {
      if (screen === 0 && !(data.customerName || '').trim()) { toast('Add a customer name to continue'); const el = $('f_customerName'); if (el) el.focus(); return; }
      go(screen === STEPS.length - 1 ? 'review' : screen + 1);
    };
  } else if (isReview) {
    back.textContent = 'Edit';
    next.textContent = 'Save and exit';
    back.onclick = () => go(STEPS.length - 1);
    next.onclick = () => { saveNow(); go('home'); toast('Capture saved'); };
  } else if (isDebrief) {
    back.textContent = 'Back';
    next.textContent = 'Go to review';
    back.onclick = () => go(pendingReturn());
    next.onclick = () => go('review');
  } else if (isDeliver) {
    back.textContent = 'Back';
    next.textContent = 'Save and exit';
    back.onclick = () => go('review');
    next.onclick = () => { saveNow(); go('home'); toast('Capture saved'); };
  }
}

let lastScreen = 0;
function pendingReturn(){ return lastScreen === 'home' ? 0 : lastScreen === 'debrief' ? 'review' : lastScreen; }
function render(){
  const v = $('view');
  v.innerHTML = screen === 'home' ? renderHome() : screen === 'review' ? renderReview() : screen === 'debrief' ? renderDebrief() : screen === 'deliver' ? renderDeliverables() : renderStep(screen);
  updateChrome();
  hydratePhotos();
}
function go(s){
  if (screen === 'debrief' && s !== 'debrief') stopRecording();
  if (s === 'debrief' && screen !== 'debrief') lastScreen = screen;
  if (screen !== 'home') saveNow();
  screen = s;
  if (s !== 'home') saveNow();
  render();
  window.scrollTo(0, 0);
}

document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });
render();
</script>
</body>
</html>
